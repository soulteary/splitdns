name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

        if: "!(github.event_name == 'pull_request')"
      - name: Remove stale generated report evidence
        if: always() && (github.event_name == 'pull_request')
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.3)
        id: go_test_report
        env:
          # Bash 3 treats an empty auth array as unset; pass the read-only job token.
          GITHUB_TOKEN: ${{ github.token }}
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89  # v1.1.3
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.3"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.7)
        id: go_report_card
        env:
          # Bash 3 treats an empty auth array as unset; pass the read-only job token.
          GITHUB_TOKEN: ${{ github.token }}
        uses: soulteary/goreportcard-action@9744d0297ca0116cd4ef83e4ff6f3ba42a65a24d  # v1.1.7
        with:
          directory: "."
          version: "v1.1.7"
          threshold: "0"
          report: "true"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Restore project Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "v2.15.0"

      - name: Build
        run: go build ./...

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: check

      # Read-only integration tests on the macOS runner. These observe the
      # runner's DNS state via scutil/dscacheutil and never modify
      # /etc/resolver. Write-path logic is covered by hermetic unit tests
      # using injected temp roots.
      - name: Read-only integration tests
        run: go test -tags integration ./integration/...
      - name: Upload read-only PR quality evidence
        if: always() && (github.event_name == 'pull_request')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
